; Transaction pooling: a server connection is borrowed per transaction.
; Orbyn only uses transaction-scoped features (pg_advisory_xact_lock,
; unnamed prepared statements), which are safe in this mode.
; The [databases] section is written by entrypoint.sh: the primary for every
; database name, plus "<name>_read" routed to a replica when READ_HOST is set.

[pgbouncer]
listen_addr = 0.0.0.0
listen_port = 6432
auth_type = scram-sha-256
auth_file = /etc/pgbouncer/userlist.txt
pool_mode = transaction
; Client side: every service replica's pool combined.
max_client_conn = 5000
; Server side: what Postgres actually sees per database/user pair.
default_pool_size = 40
min_pool_size = 5
reserve_pool_size = 10
reserve_pool_timeout = 3
server_idle_timeout = 60
ignore_startup_parameters = extra_float_digits,options
log_connections = 0
log_disconnections = 0
