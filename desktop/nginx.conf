limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;
server {
 listen 8080;
 resolver 127.0.0.11 valid=10s ipv6=off;
 root /usr/share/nginx/html;
 add_header X-Content-Type-Options nosniff always;
 add_header Referrer-Policy strict-origin-when-cross-origin always;
 add_header X-Frame-Options DENY always;
 location /api/ {
  limit_req zone=api_limit burst=30 nodelay;
  # Everything under /api goes to the gateway, which routes it to a service.
  # Docker DNS is resolved per request so restarts never break routing.
  set $gateway_upstream gateway:8080;
  rewrite ^/api/(.*)$ /$1 break;
  proxy_pass http://$gateway_upstream;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_read_timeout 125s;
  proxy_set_header Host $host;
 }
 # The page itself is always re-checked, so a deploy reaches browsers on the
 # next load instead of running cached old code; Vite's hashed files never
 # change, so they cache for a year. (add_header in a location replaces the
 # server-level ones, hence the repeats.)
 location = /index.html {
  add_header Cache-Control "no-cache" always;
  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;
  add_header X-Frame-Options DENY always;
 }
 location /assets/ {
  add_header Cache-Control "public, max-age=31536000, immutable" always;
  add_header X-Content-Type-Options nosniff always;
  try_files $uri =404;
 }
 location / { try_files $uri $uri/ /index.html; }
}
