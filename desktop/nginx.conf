# The scheme the browser used: kept from a TLS proxy in front, else our own.
map $http_x_forwarded_proto $fwd_proto {
  default $http_x_forwarded_proto;
  "" $scheme;
}
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;
server {
 listen 8080;
 resolver 127.0.0.11 valid=10s ipv6=off;
 root /usr/share/nginx/html;
 # Text responses travel compressed; the hashed assets are the big ones.
 gzip on;
 gzip_vary on;
 gzip_comp_level 5;
 gzip_min_length 1024;
 gzip_types text/plain text/css text/xml application/javascript application/json application/xml application/manifest+json image/svg+xml;
 add_header X-Content-Type-Options nosniff always;
 add_header Referrer-Policy strict-origin-when-cross-origin always;
 add_header X-Frame-Options DENY always;
 location /api/ {
  limit_req zone=api_limit burst=30 nodelay;
  # Everything under /api goes to the gateway, which routes it to a service.
  # Docker DNS is resolved per request so restarts never break routing.
  set $gateway_upstream gateway:8080;
  rewrite ^/api/(.*)$ /$1 break;
  proxy_pass http://$gateway_upstream;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_read_timeout 125s;
  proxy_set_header Host $host;
  proxy_set_header X-Forwarded-Proto $fwd_proto;
  # Links the API builds (the calendar feed) need the /api it sits under.
  proxy_set_header X-Forwarded-Prefix /api;
 }
 # The page itself is always re-checked, so a deploy reaches browsers on the
 # next load instead of running cached old code; Vite's hashed files never
 # change, so they cache for a year. (add_header in a location replaces the
 # server-level ones, hence the repeats.)
 location = /index.html {
  add_header Cache-Control "no-cache" always;
  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;
  add_header X-Frame-Options DENY always;
 }
 location /assets/ {
  add_header Cache-Control "public, max-age=31536000, immutable" always;
  add_header X-Content-Type-Options nosniff always;
  try_files $uri =404;
 }
 # The build uses relative asset paths (the native app loads from disk), so a
 # page opened at a nested path such as /book/confirm/<token> asks for
 # /book/confirm/assets/… — serve those from /assets.
 location ~ ^/(?!api/|assets/).*/(assets/[^/]+)$ {
  add_header Cache-Control "public, max-age=31536000, immutable" always;
  add_header X-Content-Type-Options nosniff always;
  try_files /$1 =404;
 }
 # Icons, the web manifest and the share image sit at the site root. The
 # build uses relative paths, so a page at /book/x asks for /book/favicon.svg;
 # serve those from the root too. They aren't hashed, so a day's cache.
 # Regex locations match in file order, so this sits above the booking pages'.
 location ~ ^/(?:(?!api/).*/)?(favicon\.(?:ico|svg)|apple-touch-icon\.png|icon-(?:192|512)\.png|site\.webmanifest|og-image\.png)$ {
  add_header Cache-Control "public, max-age=86400" always;
  add_header X-Content-Type-Options nosniff always;
  # This image's type table lacks .webmanifest; a types block replaces the
  # inherited table, so every type served here is listed.
  types {
   image/x-icon ico;
   image/svg+xml svg;
   image/png png;
   application/manifest+json webmanifest;
  }
  try_files /$1 =404;
 }
 # Public booking, invite, profile and RSVP pages may be embedded in other
 # sites (an iframe) and aren't for search engines; every other page stays
 # unframeable (X-Frame-Options above). The page is served from here rather
 # than through /index.html, so these are the headers it gets.
 location ~ ^/(book|invite|u|rsvp)/ {
  add_header Cache-Control "no-cache" always;
  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;
  add_header Content-Security-Policy "frame-ancestors *" always;
  add_header X-Robots-Tag "noindex, nofollow" always;
  try_files /index.html =404;
 }
 # For search engines. Built from the request's own host, so no deployment
 # needs its domain written into the repository. The homepage is for
 # indexing; the app needs a sign-in and the booking pages say noindex.
 location = /robots.txt {
  default_type text/plain;
  return 200 "User-agent: *\nDisallow: /api/\nDisallow: /app\nDisallow: /login\nDisallow: /signup\nDisallow: /status\nDisallow: /book/\nDisallow: /invite/\nDisallow: /u/\nDisallow: /rsvp/\nSitemap: $fwd_proto://$host/sitemap.xml\n";
 }
 location = /sitemap.xml {
  default_type application/xml;
  return 200 "<?xml version=\"1.0\" encoding=\"UTF-8\"?>\n<urlset xmlns=\"http://www.sitemaps.org/schemas/sitemap/0.9\"><url><loc>$fwd_proto://$host/</loc><changefreq>weekly</changefreq><priority>1.0</priority></url></urlset>\n";
 }
 # Every other path (/app, /status, /book/<page>, /book/confirm/<token>…)
 # is the single-page app.
 location / { try_files $uri $uri/ /index.html; }
}
