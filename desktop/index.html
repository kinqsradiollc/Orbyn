<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#f7f8fa" />
    <title>Orbyn — Make space for what matters</title>
    <script>
      // Apply the saved theme before first paint to avoid a flash (see src/lib/theme.ts).
      try {
        var theme = localStorage.getItem("orbyn-theme");
        if (theme === "light" || theme === "dark")
          document.documentElement.dataset.theme = theme;
        if (
          theme === "dark" ||
          (theme !== "light" &&
            matchMedia("(prefers-color-scheme: dark)").matches)
        )
          document
            .querySelector('meta[name="theme-color"]')
            .setAttribute("content", "#121614");
      } catch (e) {}
    </script>
    <style>
      html {
        background: #f7f8fa;
      }
      html[data-theme="dark"] {
        background: #121614;
        color-scheme: dark;
      }
      @media (prefers-color-scheme: dark) {
        html:not([data-theme="light"]) {
          background: #121614;
          color-scheme: dark;
        }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
