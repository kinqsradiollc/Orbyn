<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#f7f8fa" />
    <title>Orbyn — Make space for what matters</title>
    <script>
      // Apply the saved theme before first paint (see src/lib/theme.ts): light
      // unless Dark, or System on a dark device, was chosen in Settings.
      try {
        var theme = localStorage.getItem("orbyn-theme");
        var dark =
          theme === "dark" ||
          (theme === "system" &&
            matchMedia("(prefers-color-scheme: dark)").matches);
        document.documentElement.dataset.theme = dark ? "dark" : "light";
        if (dark)
          document
            .querySelector('meta[name="theme-color"]')
            .setAttribute("content", "#121614");
      } catch (e) {}
    </script>
    <style>
      html {
        background: #f7f8fa;
      }
      html[data-theme="dark"] {
        background: #121614;
        color-scheme: dark;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
