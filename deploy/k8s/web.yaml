# The web app: static files on nginx-unprivileged (desktop/Dockerfile), port 8080.
#
# The image's own desktop/nginx.conf assumes Docker (resolver 127.0.0.11, a
# "gateway" host), neither of which exists here. The ConfigMap below replaces
# it with a Kubernetes version.
#
# How /api/* reaches the backend. The app calls same-origin "/api"
# (desktop/src/lib/api.ts), and the prefix is stripped before the services.
#   A. (default, below) This nginx proxies /api/* to the in-cluster Services,
#      split by path the same way as the api.orbyn.example Ingress. One hop,
#      no hairpin through the load balancer, no CORS. Cost: the path split
#      lives in three places (app.ts, ingress.yaml, here); keep them in step.
#   B. Proxy /api/ to the public API host (proxy_pass https://api.orbyn.example/).
#      Routing lives in one place, but each call hairpins through the load
#      balancer and TLS. The ingress then sees web pods as the client, so its
#      per-IP rate limit needs proxy-real-ip-cidr set to the pod CIDR.
#      NetworkPolicy must also allow web egress to the load balancer.
#   C. No proxy: build the app with VITE_API_URL=https://api.orbyn.example
#      (desktop/Dockerfile needs a build ARG for it). Browsers call the API host
#      directly; CORS_ORIGINS must include https://app.orbyn.example.
#   D. Route app.orbyn.example/api/* at the Ingress with a regex path and
#      rewrite-target, bypassing this nginx. Needs a separate Ingress object,
#      since rewrite annotations apply to the whole Ingress.
#
# nginx resolves the Service names once, at start. ClusterIPs are stable, so
# this is fine; if a Service is deleted and recreated, restart web.
# A config change also needs `kubectl -n orbyn rollout restart deploy/web`,
# because files mounted with subPath do not update in place.
apiVersion: v1
kind: ConfigMap
metadata:
  name: web-nginx
  labels:
    app.kubernetes.io/name: orbyn
    app.kubernetes.io/component: web
data:
  default.conf: |
    upstream orbyn_api {
      server api.orbyn.svc.cluster.local:8000;
      keepalive 64;
    }
    upstream orbyn_ai {
      server ai.orbyn.svc.cluster.local:8000;
      keepalive 16;
    }
    upstream orbyn_realtime {
      server realtime.orbyn.svc.cluster.local:8000;
      keepalive 16;
    }
    upstream orbyn_status {
      server status.orbyn.svc.cluster.local:8000;
      keepalive 8;
    }
    upstream orbyn_mcp {
      server mcp.orbyn.svc.cluster.local:8000;
      keepalive 16;
    }
    upstream orbyn_files {
      server files.orbyn.svc.cluster.local:8000;
      keepalive 4;
    }

    server {
      listen 8080;
      root /usr/share/nginx/html;
      server_tokens off;
      client_max_body_size 64k;

      add_header X-Content-Type-Options nosniff always;
      add_header Referrer-Policy strict-origin-when-cross-origin always;
      add_header X-Frame-Options DENY always;

      # Probes and the status service's "gateway" check.
      location = /health {
        access_log off;
        default_type application/json;
        return 200 '{"status":"ok","service":"web"}';
      }

      # Rate limiting is done at the ingress. A limit_req here would key on the
      # ingress controller's pod IP and throttle every user together.
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_set_header Host $host;
      # The ingress controller has already set the real client IP; append
      # ours. Services (TRUST_PROXY=true) use the first address.
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
      # Every proxied path here is under /api; links the API builds need it.
      proxy_set_header X-Forwarded-Prefix /api;
      proxy_connect_timeout 5s;
      proxy_read_timeout 125s;

      # The URI on proxy_pass replaces the matched prefix: /api/ai/chat -> /ai/chat.
      location /api/ai/ {
        proxy_pass http://orbyn_ai/ai/;
      }
      # Live streams stay open: nothing buffered, a long read timeout.
      location /api/events {
        proxy_buffering off;
        proxy_read_timeout 1h;
        proxy_pass http://orbyn_realtime/events;
      }
      location = /api/status {
        proxy_pass http://orbyn_status/status;
      }
      # Uploads for importing into Docs: streamed to the file store, 50 MB.
      location /api/files/u/ {
        client_max_body_size 52m;
        proxy_request_buffering off;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        proxy_pass http://orbyn_files/files/u/;
      }
      # Pictures and files in pages: uploads streamed to the file store, and
      # signed links to show them.
      location /api/files/p/ {
        client_max_body_size 202m;
        proxy_request_buffering off;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        proxy_pass http://orbyn_files/files/p/;
      }
      location /api/files/r/ {
        proxy_pass http://orbyn_files/files/r/;
      }
      # The MCP address for older setups: the mcp service, as on the MCP host.
      location = /api/mcp {
        client_max_body_size 36m;
        proxy_buffering off;
        proxy_read_timeout 100s;
        proxy_pass http://orbyn_mcp/mcp;
      }
      # Markdown and Notion exports into pages (DATA-08): up to 20 MB as
      # base64 JSON.
      location = /api/imports/pages {
        client_max_body_size 28m;
        proxy_pass http://orbyn_api/imports/pages;
      }
      location /api/ {
        proxy_pass http://orbyn_api/;
      }
      # Published pages (SHR-05): plain HTML written by the API.
      location ^~ /p/ {
        proxy_pass http://orbyn_api/p/;
      }
      # Signing in with Orbyn: the authorization server's metadata (RFC 8414)
      # at the issuer (this host), from the API.
      location = /.well-known/oauth-authorization-server {
        proxy_pass http://orbyn_api/.well-known/oauth-authorization-server;
      }
      # Where to report a security problem (RFC 9116), from the API.
      location = /.well-known/security.txt {
        proxy_pass http://orbyn_api/.well-known/security.txt;
      }
      # The files phones check to open /app/ links in the Orbyn app.
      location = /.well-known/apple-app-site-association {
        proxy_pass http://orbyn_api/.well-known/apple-app-site-association;
      }
      location = /.well-known/assetlinks.json {
        proxy_pass http://orbyn_api/.well-known/assetlinks.json;
      }
      # Well-known documents this app doesn't have: a 404, not the app's page.
      location ^~ /.well-known/ {
        default_type application/json;
        return 404 '{"message":"That isn\'t here."}';
      }

      # Public booking, invite, profile and RSVP pages may be embedded in
      # other sites (an iframe) and aren't for search engines; every other
      # page stays unframeable (X-Frame-Options above).
      location ~ ^/(book|invite|u|rsvp)/ {
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header Content-Security-Policy "frame-ancestors *" always;
        add_header X-Robots-Tag "noindex, nofollow" always;
        try_files /index.html =404;
      }

      # The consent page for connecting an app: never framed, cached,
      # indexed or sent on as a referrer.
      location = /oauth/authorize {
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy no-referrer always;
        add_header X-Frame-Options DENY always;
        add_header Content-Security-Policy "frame-ancestors 'none'" always;
        add_header X-Robots-Tag "noindex, nofollow" always;
        try_files /index.html =404;
      }

      location / {
        try_files $uri $uri/ /index.html;
      }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  labels:
    app.kubernetes.io/name: orbyn
    app.kubernetes.io/component: web
spec:
  # No "replicas": the HPA below owns the count.
  revisionHistoryLimit: 5
  minReadySeconds: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 25%
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: orbyn
      app.kubernetes.io/component: web
  template:
    metadata:
      labels:
        app.kubernetes.io/name: orbyn
        app.kubernetes.io/component: web
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        # nginx-unprivileged runs as UID/GID 101.
        runAsUser: 101
        runAsGroup: 101
        fsGroup: 101
        seccompProfile:
          type: RuntimeDefault
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: orbyn
              app.kubernetes.io/component: web
          matchLabelKeys: [pod-template-hash]
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: orbyn
              app.kubernetes.io/component: web
          matchLabelKeys: [pod-template-hash]
      containers:
        - name: web
          # Placeholder: set the real registry and tag in kustomization.yaml.
          image: ghcr.io/your-org/orbyn-web:TAG
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 128Mi
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 5
            timeoutSeconds: 2
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          lifecycle:
            preStop:
              exec:
                command: ["sleep", "5"]
          # The image keeps its pid file and temp paths in /tmp, so a
          # read-only root filesystem works with an emptyDir there.
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: nginx-conf
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: default.conf
              readOnly: true
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
        - name: nginx-conf
          configMap:
            name: web-nginx
---
apiVersion: v1
kind: Service
metadata:
  name: web
  labels:
    app.kubernetes.io/name: orbyn
    app.kubernetes.io/component: web
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: orbyn
    app.kubernetes.io/component: web
  ports:
    - name: http
      port: 8080
      targetPort: http
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: web
  labels:
    app.kubernetes.io/name: orbyn
    app.kubernetes.io/component: web
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: web
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: web
  labels:
    app.kubernetes.io/name: orbyn
    app.kubernetes.io/component: web
spec:
  minAvailable: 1
  unhealthyPodEvictionPolicy: AlwaysAllow
  selector:
    matchLabels:
      app.kubernetes.io/name: orbyn
      app.kubernetes.io/component: web
