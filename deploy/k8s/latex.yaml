# Private document renderer. Provision deploy/latex/seccomp.json at this kubelet
# localhost profile path on every eligible node before enabling this deployment.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: latex
  labels: { app.kubernetes.io/name: orbyn, app.kubernetes.io/component: latex }
spec:
  replicas: 1
  selector:
    matchLabels:
      { app.kubernetes.io/name: orbyn, app.kubernetes.io/component: latex }
  template:
    metadata:
      labels:
        { app.kubernetes.io/name: orbyn, app.kubernetes.io/component: latex }
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      terminationGracePeriodSeconds: 35
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          { type: Localhost, localhostProfile: orbyn/latex-seccomp.json }
      containers:
        - name: latex
          image: ghcr.io/your-org/orbyn-latex:TAG
          command: ["/usr/bin/tini", "--", "node", "backend/dist/services/latex.js"]
          ports: [{ name: http, containerPort: 8000 }]
          # Deliberately omit envFrom: the renderer does not receive the database,
          # mail, provider or file-store credentials in orbyn-secrets.
          env:
            - name: PORT
              value: "8000"
            - name: DOC_PDF_KEY
              valueFrom:
                { secretKeyRef: { name: orbyn-secrets, key: DOC_PDF_KEY } }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
          resources:
            requests: { cpu: 250m, memory: 256Mi }
            limits: { cpu: "1", memory: 768Mi }
          readinessProbe:
            httpGet: { path: /health, port: http }
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /health, port: http }
            periodSeconds: 20
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
            - { name: shm, mountPath: /dev/shm }
      volumes:
        - name: tmp
          emptyDir: { medium: Memory, sizeLimit: 128Mi }
        - name: shm
          emptyDir: { medium: Memory, sizeLimit: 256Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: latex
  labels: { app.kubernetes.io/name: orbyn, app.kubernetes.io/component: latex }
spec:
  selector:
    { app.kubernetes.io/name: orbyn, app.kubernetes.io/component: latex }
  ports: [{ name: http, port: 8000, targetPort: http }]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: private-latex-renderer
spec:
  podSelector:
    matchLabels: { app.kubernetes.io/component: latex }
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - podSelector:
            matchLabels: { app.kubernetes.io/component: api }
      ports: [{ protocol: TCP, port: 8000 }]
  egress: []
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-api-to-latex
spec:
  podSelector:
    matchLabels: { app.kubernetes.io/component: api }
  policyTypes: [Egress]
  egress:
    - to:
        - podSelector:
            matchLabels: { app.kubernetes.io/component: latex }
      ports: [{ protocol: TCP, port: 8000 }]
