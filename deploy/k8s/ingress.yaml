# Public entry points, which replace the Compose gateway (gateway/nginx.conf.template).
#
#   api.orbyn.example  /ai/*     -> ai      (assistant, AI provider admin)
#                      /status   -> status  (public status report)
#                      /mcp      -> mcp     (older agent setups; orbyn-api-mcp)
#                      /*        -> api     (everything else)
#   app.orbyn.example  /*        -> web     (static app; its nginx proxies /api/*)
#   mcp.orbyn.example  /mcp, /.well-known/oauth-protected-resource[/mcp] and
#                      /.well-known/openai-apps-challenge
#                                -> mcp     (outside AI agents; nothing else)
#
# Keep the path split in step with serviceModules in backend/src/app.ts and
# with the web nginx config in web.yaml.
#
# Controller: written for ingress-nginx (annotations nginx.ingress.kubernetes.io/*).
# The Kubernetes project has retired ingress-nginx; it no longer gets
# releases or security fixes. For a new cluster, prefer a maintained
# controller or the Gateway API (HTTPRoute). The routing moves across one to
# one, but the rate-limit and timeout annotations below must be redone in
# that controller's own terms.
#
# Real client IPs (needed for per-client rate limits here and in services):
#   - Put the controller's LoadBalancer Service on externalTrafficPolicy: Local,
#     or turn on PROXY protocol on both the cloud load balancer and the
#     controller (use-proxy-protocol: "true" in its ConfigMap).
#   - If an L7 load balancer or CDN sits in front, set use-forwarded-headers
#     and proxy-real-ip-cidr in the controller ConfigMap to that tier's
#     CIDRs only. Never trust X-Forwarded-For from the internet.
#   - Leave compute-full-forwarded-for off, so the controller overwrites the
#     client's X-Forwarded-For instead of appending to a forged one. Services
#     run with TRUST_PROXY=true and take the first address in that header.
#
# Rate limiting belongs at the edge (here, a WAF, or a CDN), in front of the
# per-service backstop RATE_LIMIT_PER_MINUTE. ingress-nginx keeps limits in
# memory per controller replica, so the effective limit is roughly
# rps x controller replicas. For exact global limits use a WAF, a CDN, or a
# controller with a shared (Redis) store.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: orbyn-api
  labels:
    app.kubernetes.io/name: orbyn
    app.kubernetes.io/component: api
  annotations:
    # TLS: cert-manager issues the certificate into secretName below.
    # Placeholder issuer: use your ClusterIssuer's name.
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    # Per client IP, as the Compose gateway did: 50 r/s with a burst.
    nginx.ingress.kubernetes.io/limit-rps: "50"
    nginx.ingress.kubernetes.io/limit-burst-multiplier: "3"
    nginx.ingress.kubernetes.io/limit-connections: "200"
    # Same as the services' bodyLimit (64 KiB) and the gateway's timeouts.
    nginx.ingress.kubernetes.io/proxy-body-size: "64k"
    nginx.ingress.kubernetes.io/proxy-connect-timeout: "5"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "125"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "125"
    # Retry another replica only on connection errors or 502/503. nginx never
    # retries non-idempotent requests (POST and similar) once they were sent.
    nginx.ingress.kubernetes.io/proxy-next-upstream: "error timeout http_502 http_503"
    nginx.ingress.kubernetes.io/proxy-next-upstream-tries: "2"
    # The Compose gateway cached /status for 10s. ingress-nginx has no
    # per-path cache without snippets (often disabled), so the status service
    # serves it directly. Put a CDN in front to cache it.
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - api.orbyn.example
      secretName: orbyn-api-tls
  rules:
    - host: api.orbyn.example
      http:
        paths:
          - path: /ai
            pathType: Prefix # /ai and /ai/..., not /aix
            backend:
              service:
                name: ai
                port:
                  name: http
          # Long-lived streams (/events, /events/docs/:id): the realtime service.
          - path: /events
            pathType: Prefix
            backend:
              service:
                name: realtime
                port:
                  name: http
          - path: /status
            pathType: Exact
            backend:
              service:
                name: status
                port:
                  name: http
          - path: /
            pathType: Prefix
            backend:
              service:
                name: api
                port:
                  name: http
---
# The web app. Static files, plus /api/* proxied by the web nginx (web.yaml).
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: orbyn-web
  labels:
    app.kubernetes.io/name: orbyn
    app.kubernetes.io/component: web
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod # placeholder
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    # Covers static assets and /api/* calls from the app together.
    nginx.ingress.kubernetes.io/limit-rps: "50"
    nginx.ingress.kubernetes.io/limit-burst-multiplier: "3"
    nginx.ingress.kubernetes.io/limit-connections: "200"
    nginx.ingress.kubernetes.io/proxy-body-size: "64k"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "125"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "125"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - app.orbyn.example
      secretName: orbyn-web-tls
  rules:
    - host: app.orbyn.example
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: web
                port:
                  name: http
---
# The MCP host for outside AI agents: only the MCP address and its
# protected-resource metadata. Limits here are per address and generous; the
# mcp service limits each connection (per credential, never per address).
# MCP_PUBLIC_URL in config.yaml must name this host.
#
# Review in phase A2: hosted agents (claude.ai, ChatGPT) reach this host from
# their providers' shared egress addresses, so many people's connections can
# arrive from one address. Before they do, raise limit-rps and
# limit-connections for those ranges (or move the per-address ceiling to a WAF
# that knows them), so the per-address backstop never limits a connection
# that is within its own per-connection limits.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: orbyn-mcp
  labels:
    app.kubernetes.io/name: orbyn
    app.kubernetes.io/component: mcp
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod # placeholder
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/limit-rps: "50"
    nginx.ingress.kubernetes.io/limit-burst-multiplier: "4"
    nginx.ingress.kubernetes.io/limit-connections: "200"
    # The mcp service takes JSON-RPC bodies up to 1 MB.
    nginx.ingress.kubernetes.io/proxy-body-size: "1m"
    nginx.ingress.kubernetes.io/proxy-buffering: "off"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "100"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "100"
    nginx.ingress.kubernetes.io/proxy-next-upstream: "error timeout http_502 http_503"
    nginx.ingress.kubernetes.io/proxy-next-upstream-tries: "2"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - mcp.orbyn.example
      secretName: orbyn-mcp-tls
  rules:
    - host: mcp.orbyn.example
      http:
        paths:
          - path: /mcp
            pathType: Exact
            backend:
              service:
                name: mcp
                port:
                  name: http
          - path: /.well-known/oauth-protected-resource
            pathType: Prefix
            backend:
              service:
                name: mcp
                port:
                  name: http
          # OpenAI's apps directory domain check (OPENAI_APPS_CHALLENGE).
          - path: /.well-known/openai-apps-challenge
            pathType: Exact
            backend:
              service:
                name: mcp
                port:
                  name: http
---
# The MCP address on the API host, for older agent setups that were given
# api.orbyn.example/mcp: the mcp service, as on the MCP host (the api service
# doesn't serve /mcp). Its own Ingress, so the MCP host's body size and
# timeouts apply to this one path; ingress-nginx merges it into the API host.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: orbyn-api-mcp
  labels:
    app.kubernetes.io/name: orbyn
    app.kubernetes.io/component: mcp
  annotations:
    # No cert-manager annotation: orbyn-api owns and issues orbyn-api-tls,
    # and this Ingress only reuses that secret. Two owners of one
    # Certificate make cert-manager refuse one and log it on every sync.
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    # Per address, and generous (see the note on orbyn-mcp for phase A2).
    nginx.ingress.kubernetes.io/limit-rps: "50"
    nginx.ingress.kubernetes.io/limit-burst-multiplier: "4"
    nginx.ingress.kubernetes.io/limit-connections: "200"
    nginx.ingress.kubernetes.io/proxy-body-size: "1m"
    nginx.ingress.kubernetes.io/proxy-buffering: "off"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "100"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "100"
    nginx.ingress.kubernetes.io/proxy-next-upstream: "error timeout http_502 http_503"
    nginx.ingress.kubernetes.io/proxy-next-upstream-tries: "2"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - api.orbyn.example
      secretName: orbyn-api-tls
  rules:
    - host: api.orbyn.example
      http:
        paths:
          - path: /mcp
            pathType: Exact
            backend:
              service:
                name: mcp
                port:
                  name: http
---
# Agents following Orbyn (MCP subscriptions/listen) hold a stream open, so
# those requests go to the realtime service, never the stateless mcp pods:
# a canary Ingress on the same host and path, chosen by the Mcp-Method
# header (the gateway's `map $http_mcp_method` in Compose). The service
# closes each stream within 15 minutes and sends keep-alives every 25 s.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: orbyn-mcp-listen
  labels:
    app.kubernetes.io/name: orbyn
    app.kubernetes.io/component: realtime
  annotations:
    nginx.ingress.kubernetes.io/canary: "true"
    nginx.ingress.kubernetes.io/canary-by-header: "Mcp-Method"
    nginx.ingress.kubernetes.io/canary-by-header-value: "subscriptions/listen"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/limit-connections: "50"
    nginx.ingress.kubernetes.io/proxy-body-size: "64k"
    nginx.ingress.kubernetes.io/proxy-buffering: "off"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - mcp.orbyn.example
      secretName: orbyn-mcp-tls
  rules:
    - host: mcp.orbyn.example
      http:
        paths:
          - path: /mcp
            pathType: Exact
            backend:
              service:
                name: realtime
                port:
                  name: http
---
# The same for api.orbyn.example/mcp (older setups).
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: orbyn-api-mcp-listen
  labels:
    app.kubernetes.io/name: orbyn
    app.kubernetes.io/component: realtime
  annotations:
    nginx.ingress.kubernetes.io/canary: "true"
    nginx.ingress.kubernetes.io/canary-by-header: "Mcp-Method"
    nginx.ingress.kubernetes.io/canary-by-header-value: "subscriptions/listen"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/limit-connections: "50"
    nginx.ingress.kubernetes.io/proxy-body-size: "64k"
    nginx.ingress.kubernetes.io/proxy-buffering: "off"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - api.orbyn.example
      secretName: orbyn-api-tls
  rules:
    - host: api.orbyn.example
      http:
        paths:
          - path: /mcp
            pathType: Exact
            backend:
              service:
                name: realtime
                port:
                  name: http
