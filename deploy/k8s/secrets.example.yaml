# EXAMPLE ONLY. Do not apply this file, and never commit it with real values.
#
# In production, orbyn-secrets must come from a secret manager, for example:
#   - External Secrets Operator: an ExternalSecret that syncs these keys from
#     AWS Secrets Manager, GCP Secret Manager, Azure Key Vault or Vault.
#   - SOPS (with age or KMS): commit only the encrypted file, and decrypt it in
#     CI or with a GitOps plugin (Flux, or ksops for Argo CD).
# For a throwaway cluster only, `kubectl create secret generic orbyn-secrets
# --from-env-file=...` is fine.
#
# kustomization.yaml leaves this file out on purpose.
#
# Every backend pod loads the whole Secret with envFrom, so every key here
# becomes an environment variable. The backend ignores keys it does not use.
apiVersion: v1
kind: Secret
metadata:
  name: orbyn-secrets
  namespace: orbyn
  labels:
    app.kubernetes.io/name: orbyn
type: Opaque
stringData:
  # Primary database, used for writes, transactions and fresh reads. Point it at
  # a pooler: the managed one (RDS Proxy, Cloud SQL managed pooling, Azure
  # Flexible Server PgBouncer) or pgbouncer.yaml. Managed databases usually
  # need TLS, so add ?sslmode=require (or verify-full) when you connect directly.
  DATABASE_URL: "postgres://orbyn:CHANGE_ME@pgbouncer.orbyn.svc.cluster.local:6432/orbyn"

  # Optional read replica, for lag-tolerant reads (backend/src/db/pool.ts).
  # With pgbouncer.yaml and READ_HOST set, PgBouncer exposes it as "<DB_NAME>_read".
  # Set it to "" to send all reads to the primary.
  DATABASE_READ_URL: "postgres://orbyn:CHANGE_ME@pgbouncer.orbyn.svc.cluster.local:6432/orbyn_read"

  # Live document changes travel on a LISTEN, which a transaction pooler
  # cannot hold open, so that one connection per API pod goes to the primary
  # directly. Leave it out when DATABASE_URL already does.
  DATABASE_LISTEN_URL: "postgres://orbyn:CHANGE_ME@orbyn-primary.db.example.internal:5432/orbyn?sslmode=require"

  # Used only by the migrate Job, and it connects to the primary directly
  # (not through a transaction pooler), the same way compose.yaml runs migrations.
  MIGRATE_DATABASE_URL: "postgres://orbyn:CHANGE_ME@orbyn-primary.db.example.internal:5432/orbyn?sslmode=require"

  # Recommended: 32 random bytes, base64 (openssl rand -base64 32). Encrypts AI
  # provider keys saved from the admin console with a key kept outside the
  # database. Without it, Orbyn keeps a generated key in the database. Keep it
  # stable once set: keys saved with it need it to be read.
  SECRETS_KEY: "CHANGE_ME_BASE64_32_BYTES"

  SMTP_PASSWORD: "CHANGE_ME"

  # Comma-separated emails that are always system admins.
  ADMIN_EMAILS: "admin@orbyn.example"

  # Optional: Expo access token for push notifications (notifier).
  EXPO_ACCESS_TOKEN: ""

  # Importing files into Docs (imports.yaml). FILES_SECRET signs upload links
  # (api, files, converter); blank turns importing off. FILES_MASTER_KEY
  # wraps each stored file's key (files). Both: openssl rand -base64 32.
  FILES_SECRET: ""
  FILES_MASTER_KEY: ""

  # Used only by pgbouncer.yaml (optional). The PgBouncer entrypoint writes
  # these into its config at start.
  DB_USER: "orbyn"
  DB_PASSWORD: "CHANGE_ME"
  DB_NAME: "orbyn"
  PRIMARY_HOST: "orbyn-primary.db.example.internal"
  READ_HOST: "orbyn-replica.db.example.internal" # "" when there is no replica
