# orbyn.dev. Mirrors site/public/_headers, which Cloudflare Workers uses.
server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  server_tokens off;
  absolute_redirect off;
  charset utf-8;

  gzip on;
  gzip_types text/css text/javascript application/javascript image/svg+xml text/plain;

  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), interest-cohort=()" always;
  add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'none'; form-action 'none'" always;
  add_header Cross-Origin-Opener-Policy "same-origin" always;
  add_header Cache-Control "no-cache" always;

  location = /healthz { access_log off; default_type text/plain; return 200 "ok\n"; }

  location ~ ^/(assets|fonts)/ {
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    try_files $uri =404;
  }

  # Booking is planned inside Orbyn Planner; its own not-found page says so.
  location ~ ^/booking(/|$) { error_page 404 /booking/404.html; return 404; }
  location = /booking/404.html { internal; }
  location = /404.html { internal; }

  location / { try_files $uri $uri/index.html $uri/ =404; }
  error_page 404 /404.html;
}
