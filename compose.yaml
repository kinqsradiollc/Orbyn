# Orbyn as microservices. Every backend service runs from the same image with a
# different command; only the gateway and the web app are published.
#
#   clients -> gateway :8008 -> api | ai | status -> pgbouncer -> postgres
#   web :8080 (static app) -> /api -> gateway
#   notifier (reminders) and status (probes) run in the background.
#   Scale any service: docker compose up -d --scale api=3 --scale ai=2

x-backend: &backend
  build:
    context: .
    dockerfile: backend/Dockerfile
    args:
      GIT_SHA: ${GIT_SHA:-dev}
      BUILD_TIME: ${BUILD_TIME:-}
  # In-flight requests get this long to finish when a copy is replaced.
  stop_grace_period: 30s
  env_file:
    - path: .env
      required: false
  restart: unless-stopped

x-backend-env: &backend-env
  # Services reach Postgres through PgBouncer; migrations connect directly.
  DATABASE_URL: postgres://${POSTGRES_USER:-orbyn}:${POSTGRES_PASSWORD}@pgbouncer:6432/${POSTGRES_DB:-orbyn}
  # Optional read replica, e.g. through PgBouncer's "<db>_read" route.
  DATABASE_READ_URL: ${DOCKER_DATABASE_READ_URL:-}
  # Live document changes travel on a LISTEN, which PgBouncer's transaction
  # pooling cannot hold open, so that one connection goes straight to Postgres.
  DATABASE_LISTEN_URL: postgres://${POSTGRES_USER:-orbyn}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-orbyn}
  DB_POOL_MAX: ${DB_POOL_MAX:-20}
  RATE_LIMIT_PER_MINUTE: ${SERVICE_RATE_LIMIT_PER_MINUTE:-1200}
  SMTP_HOST: ${DOCKER_SMTP_HOST:-mailpit}
  PORT: 8000
  TRUST_PROXY: "true"

x-http-health: &http-health
  test: ["CMD", "node", "-e", "fetch('http://localhost:8000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
  interval: 10s
  timeout: 5s
  retries: 10

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-orbyn}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-orbyn}
    ports: ["127.0.0.1:${POSTGRES_PORT:-5433}:5432"]
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # First start only: allow streaming replicas (see the replica profile).
      - ./deploy/postgres/primary-replication.sh:/docker-entrypoint-initdb.d/10-replication.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 15
    restart: unless-stopped

  # Throwaway database for the test suite: separate server, data kept in memory,
  # marked as a test database on creation. Start with
  #   docker compose --profile test up -d postgres-test
  postgres-test:
    image: postgres:17-alpine
    profiles: [test]
    environment:
      POSTGRES_USER: orbyn
      POSTGRES_PASSWORD: orbyn-test
      POSTGRES_DB: orbyn_test
    ports: ["127.0.0.1:${TEST_POSTGRES_PORT:-55434}:5432"]
    tmpfs: ["/var/lib/postgresql/data"]
    volumes: ["./backend/tests/db/init-test-db.sql:/docker-entrypoint-initdb.d/init-test-db.sql:ro"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U orbyn -d orbyn_test"]
      interval: 3s
      timeout: 3s
      retries: 20

  # Connection pooler between every service and Postgres.
  pgbouncer:
    build: { context: ./pgbouncer }
    environment:
      DB_USER: ${POSTGRES_USER:-orbyn}
      DB_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      DB_NAME: ${POSTGRES_DB:-orbyn}
      PRIMARY_HOST: postgres
      # Set to postgres-replica (with the replica profile) to add "<db>_read".
      READ_HOST: ${PGBOUNCER_READ_HOST:-}
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 6432"]
      interval: 5s
      timeout: 3s
      retries: 20
    depends_on:
      postgres: { condition: service_healthy }
    restart: unless-stopped

  # Streaming read replica. Start with the "replica" profile, then point
  # DOCKER_DATABASE_READ_URL at pgbouncer:6432/<db>_read. See docs/scalability.md.
  postgres-replica:
    image: postgres:17-alpine
    profiles: [replica]
    entrypoint:
      - /bin/sh
      - -c
      - tr -d '\r' < /usr/local/bin/replica-entrypoint.sh > /tmp/replica-entrypoint.sh && exec /bin/sh /tmp/replica-entrypoint.sh
    environment:
      PGUSER: ${POSTGRES_USER:-orbyn}
      PGPASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      PRIMARY_HOST: postgres
    ports: ["127.0.0.1:${REPLICA_PORT:-5434}:5432"]
    volumes:
      - postgres_replica_data:/var/lib/postgresql/data
      - ./deploy/postgres/replica-entrypoint.sh:/usr/local/bin/replica-entrypoint.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$PGUSER"]
      interval: 5s
      timeout: 5s
      retries: 30
    depends_on:
      postgres: { condition: service_healthy }
    restart: unless-stopped

  migrate:
    <<: *backend
    environment:
      <<: *backend-env
      DATABASE_URL: postgres://${POSTGRES_USER:-orbyn}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-orbyn}
    command: ["node", "backend/dist/migrate.js"]
    restart: "no"
    depends_on:
      postgres: { condition: service_healthy }

  # Accounts, items, teams, devices, notifications, admin console.
  api:
    <<: *backend
    environment: *backend-env
    command: ["node", "backend/dist/services/api.js"]
    healthcheck: *http-health
    # Two copies, so scripts/deploy.sh can replace them without downtime.
    deploy: { replicas: "${API_REPLICAS:-2}" }
    depends_on:
      migrate: { condition: service_completed_successfully }
      pgbouncer: { condition: service_healthy }

  # The assistant; the only service that talks to AI providers.
  ai:
    <<: *backend
    environment: *backend-env
    command: ["node", "backend/dist/services/ai.js"]
    healthcheck: *http-health
    deploy: { replicas: "${AI_REPLICAS:-2}" }
    depends_on:
      migrate: { condition: service_completed_successfully }
      pgbouncer: { condition: service_healthy }

  # Schedules and delivers reminders; reports liveness by heartbeat.
  notifier:
    <<: *backend
    environment: *backend-env
    command: ["node", "backend/dist/services/notifier.js"]
    depends_on:
      migrate: { condition: service_completed_successfully }
      pgbouncer: { condition: service_healthy }

  # Probes every component and serves the public status report.
  status:
    <<: *backend
    environment:
      <<: *backend-env
      STATUS_GATEWAY_URL: http://gateway:8080
      STATUS_API_URL: http://api:8000
      STATUS_AI_URL: http://ai:8000
    command: ["node", "backend/dist/services/status.js"]
    healthcheck: *http-health
    depends_on:
      migrate: { condition: service_completed_successfully }
      pgbouncer: { condition: service_healthy }

  # Single entry point for clients; routes paths to services.
  gateway:
    image: nginxinc/nginx-unprivileged:1.28-alpine
    # Strips Windows line endings from the mounted script before running it.
    entrypoint:
      - /bin/sh
      - -c
      - tr -d '\r' < /etc/orbyn-gateway/entrypoint.sh > /tmp/orbyn-gateway.sh && exec /bin/sh /tmp/orbyn-gateway.sh
    stop_signal: SIGQUIT
    environment:
      # Instances per service ("host:port ..."); point these at other machines
      # to run services elsewhere. See gateway/entrypoint.sh.
      API_SERVERS: ${GATEWAY_API_SERVERS:-api:8000}
      AI_SERVERS: ${GATEWAY_AI_SERVERS:-ai:8000}
      STATUS_SERVERS: ${GATEWAY_STATUS_SERVERS:-status:8000}
      WEB_SERVERS: ${GATEWAY_WEB_SERVERS:-desktop:8080}
      RESOLVER: ${GATEWAY_RESOLVER:-127.0.0.11}
      TRUSTED_PROXIES: ${GATEWAY_TRUSTED_PROXIES:-}
      RATE_LIMIT_EXEMPT: ${GATEWAY_RATE_LIMIT_EXEMPT:-127.0.0.1/32 192.168.65.0/24}
    volumes: ["./gateway:/etc/orbyn-gateway:ro"]
    # The gateway is the only service with host ports: the API and the web app.
    ports:
      - "${API_BIND:-127.0.0.1}:${API_PORT:-8008}:8080"
      - "${WEB_PORT:-8080}:8081"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 10
    depends_on: [api, ai, status]
    restart: unless-stopped

  desktop:
    build:
      context: .
      dockerfile: desktop/Dockerfile
      args:
        GIT_SHA: ${GIT_SHA:-dev}
    # nginx finishes in-flight requests on SIGQUIT (SIGTERM drops them).
    stop_signal: SIGQUIT
    # Served through the gateway's web port, so copies roll over without downtime.
    deploy: { replicas: "${WEB_REPLICAS:-2}" }
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/ || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  # Public access without opening a port: Cloudflare connects to this container,
  # which reaches the gateway's web port (the app, with the API under /api).
  # Needs CLOUDFLARE_TUNNEL_TOKEN in .env; start it with
  #   docker compose --profile tunnel up -d
  cloudflared:
    image: ${CLOUDFLARED_IMAGE:-cloudflare/cloudflared:latest}
    profiles: [tunnel]
    # The token goes in the environment, not the command line, so it stays out
    # of `docker ps` and `docker inspect`.
    command: ["tunnel", "--no-autoupdate", "run"]
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN:-}
      TUNNEL_METRICS: 127.0.0.1:2000
    depends_on:
      gateway: { condition: service_healthy }
    restart: unless-stopped

  # Orbyn's own outbound mail server: it signs with DKIM and delivers straight
  # to each recipient, or through a relay (mail/maddy-relay.conf). Nothing is
  # published to the machine; only these services can hand mail over. Off
  # unless asked for:  docker compose --profile mail up -d
  # Point Orbyn at it with DOCKER_SMTP_HOST=mail and SMTP_PORT=587.
  mail:
    image: ${MADDY_IMAGE:-foxcpp/maddy:0.9.5}
    profiles: [mail]
    hostname: ${MAIL_HOSTNAME:-mail.localhost}
    entrypoint: ["/bin/sh", "/data/conf/start.sh"]
    environment:
      MAIL_CONFIG: ${MAIL_CONFIG:-maddy.conf}
      MAIL_HOSTNAME: ${MAIL_HOSTNAME:-mail.localhost}
      MAIL_DOMAIN: ${MAIL_DOMAIN:-localhost}
      # Only read by maddy-relay.conf.
      MAIL_RELAY: ${MAIL_RELAY:-}
      MAIL_RELAY_USER: ${MAIL_RELAY_USER:-}
      MAIL_RELAY_PASSWORD: ${MAIL_RELAY_PASSWORD:-}
    volumes:
      # DKIM keys and the retry queue live here; keep this volume.
      - mail_data:/data
      - ./mail:/data/conf:ro
    healthcheck:
      test: ["CMD", "nc", "-z", "127.0.0.1", "587"]
      interval: 10s
      timeout: 3s
      start_period: 10s
      retries: 5
    stop_grace_period: 30s
    restart: unless-stopped

  mailpit:
    image: axllent/mailpit:v1.29
    ports: ["127.0.0.1:8025:8025", "127.0.0.1:1025:1025"]
    restart: unless-stopped

volumes:
  postgres_data:
  postgres_replica_data:
  mail_data:
