## Orbyn's own outbound mail server: it signs each message with DKIM and
## delivers it straight to the recipient's mail server. Nothing is received
## here and no port is published to the machine; only Orbyn's own services,
## on the Docker network, can hand mail over.
##
## Delivering directly needs outbound port 25, a static address and a matching
## reverse DNS record. Where that isn't possible, send through another server
## instead with MAIL_CONFIG=maddy-relay.conf (see docs/deployment.md).

$(hostname) = {env:MAIL_HOSTNAME}
$(primary_domain) = {env:MAIL_DOMAIN}

# Nothing outside the Docker network can reach the listener, so there is no
# certificate to serve. Deliveries out require encrypted TLS connections.
tls off

hostname $(hostname)

# Where Orbyn hands mail over. The port stays inside the Docker network.
smtp tcp://0.0.0.0:587 {
    limits {
        all rate 50 1s
    }

    source $(primary_domain) {
        modify {
            # Keys live in /data/dkim_keys; the .dns file there is the record
            # to publish. Generated on first start.
            dkim $(primary_domain) default
        }
        default_destination {
            deliver_to &outbound
        }
    }
    default_source {
        reject 501 5.1.8 "Only $(primary_domain) may send through this server"
    }
}

target.remote outbound_delivery {
    limits {
        destination rate 20 1s
        destination concurrency 10
    }
    mx_auth {
        dane
        mtasts {
            cache fs
            fs_dir /data/mtasts_cache
        }
        local_policy {
            min_tls_level encrypted
            min_mx_level none
        }
    }
}

# Retries live here, so a receiving server being briefly down loses nothing.
target.queue outbound {
    target &outbound_delivery
    autogenerated_msg_domain $(primary_domain)
    max_tries 8
    bounce {
        default_destination {
            reject 550 5.0.0 "Delivery reports are only written to this container's log"
        }
    }
}
