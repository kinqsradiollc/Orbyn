## Orbyn's own outbound mail server, handing the last hop to another server.
## It still queues, retries and signs with DKIM here; only the delivery to the
## internet is someone else's address and reputation. Use this where outbound
## port 25 is blocked or the machine has no reverse DNS of its own.
##
## Set MAIL_CONFIG=maddy-relay.conf, MAIL_RELAY (tcp://host:587 or
## tls://host:465), MAIL_RELAY_USER and MAIL_RELAY_PASSWORD. See
## docs/deployment.md.

$(hostname) = {env:MAIL_HOSTNAME}
$(primary_domain) = {env:MAIL_DOMAIN}

tls off

hostname $(hostname)

smtp tcp://0.0.0.0:587 {
    limits {
        all rate 50 1s
    }

    source $(primary_domain) {
        modify {
            dkim $(primary_domain) default
        }
        default_destination {
            deliver_to &outbound
        }
    }
    default_source {
        reject 501 5.1.8 "Only $(primary_domain) may send through this server"
    }
}

target.smtp outbound_delivery {
    targets {env:MAIL_RELAY}
    # The credentials cross the internet, so the connection must be encrypted.
    starttls yes
    auth plain {env:MAIL_RELAY_USER} {env:MAIL_RELAY_PASSWORD}
}

target.queue outbound {
    target &outbound_delivery
    autogenerated_msg_domain $(primary_domain)
    max_tries 8
    bounce {
        default_destination {
            reject 550 5.0.0 "Delivery reports are only written to this container's log"
        }
    }
}
