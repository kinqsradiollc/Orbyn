name: CI
env:
  ELECTRON_SKIP_BINARY_DOWNLOAD: 1
on:
  push:
    branches: [main]
  pull_request:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  backend-and-web:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: orbyn
          POSTGRES_PASSWORD: orbyn-test
          POSTGRES_DB: orbyn_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U orbyn -d orbyn_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm run build
      - run: npm test
        env:
          DATABASE_URL: postgres://orbyn:orbyn-test@localhost:5432/orbyn_test
  mobile:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - run: npm ci
      - run: npm run typecheck
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build backend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: backend/Dockerfile
          push: false
          cache-from: type=gha,scope=backend
          cache-to: type=gha,scope=backend,mode=max
      - name: Build web image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: desktop/Dockerfile
          push: false
          cache-from: type=gha,scope=desktop
          cache-to: type=gha,scope=desktop,mode=max
