name: CI
env:
  ELECTRON_SKIP_BINARY_DOWNLOAD: 1
on:
  push:
    branches: [main]
  pull_request:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  backend-and-web:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: orbyn
          POSTGRES_PASSWORD: orbyn-test
          POSTGRES_DB: orbyn_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U orbyn -d orbyn_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run build:packages
      - run: npm run typecheck -w backend
      - run: npm run typecheck -w desktop
      - run: npm run build -w backend
      - run: npm run build -w desktop
      - name: Mark the CI database as a test database
        run: psql "postgres://orbyn:orbyn-test@localhost:5432/orbyn_test" -c "ALTER DATABASE orbyn_test SET orbyn.environment TO 'test'"
      - run: npm test -w backend
        env:
          TEST_DATABASE_URL: postgres://orbyn:orbyn-test@localhost:5432/orbyn_test
  mobile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build:packages
      - run: npm run typecheck -w mobile
      - name: Bundle with Metro (no device needed)
        run: npx expo export --platform ios --platform android --output-dir /tmp/orbyn-export
        working-directory: mobile
  docker:
    runs-on: ubuntu-latest
    env:
      COMPOSE_PROJECT_NAME: orbyn
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build:packages
      - uses: docker/setup-buildx-action@v3
      - name: Build backend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: backend/Dockerfile
          push: false
          load: true
          tags: orbyn-backend:ci
          cache-from: type=gha,scope=backend
          cache-to: type=gha,scope=backend,mode=max
      - name: Build private PDF image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: backend/Dockerfile
          target: pdf
          push: false
          load: true
          tags: orbyn-pdf:ci
          cache-from: type=gha,scope=pdf
          cache-to: type=gha,scope=pdf,mode=max
      - name: Build web image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: desktop/Dockerfile
          push: false
          load: true
          tags: orbyn-desktop:latest
          cache-from: type=gha,scope=desktop
          cache-to: type=gha,scope=desktop,mode=max
      - name: Build connection pooler image
        uses: docker/build-push-action@v6
        with:
          context: pgbouncer
          push: false
          load: true
          tags: orbyn-pgbouncer:latest
          cache-from: type=gha,scope=pgbouncer
          cache-to: type=gha,scope=pgbouncer,mode=max
      - name: Start services and run the live API smoke test
        run: |
          cp .env.example .env
          printf '\nDOC_PDF_KEY=%s\n' "$(openssl rand -hex 32)" >> .env
          # Every backend service shares this image. Derive its Compose tag so
          # new services cannot silently be omitted from the smoke deployment.
          docker compose --profile '*' config --format json |
            jq -r --arg project "$COMPOSE_PROJECT_NAME" '.services | to_entries[] | select(.value.build.dockerfile? == "backend/Dockerfile" and .value.build.target? != "pdf") | (.value.image // ($project + "-" + .key + ":latest"))' |
            while IFS= read -r image; do docker tag orbyn-backend:ci "$image"; done
          docker tag orbyn-pdf:ci "$COMPOSE_PROJECT_NAME-pdf:latest"
          docker compose up -d --no-build --wait --wait-timeout 120
          curl --fail --retry 5 --retry-all-errors http://localhost:8080/api/health
          SMOKE_AI=skip npm run smoke -w backend
      - name: Docker logs
        if: failure()
        run: docker compose logs --tail 100
      - name: Stop CI services
        if: always()
        run: docker compose down --volumes

  mail:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Start local mail stack
        run: ./scripts/mail-local.sh up
      - name: Verify signed mail reaches the TLS-only test inbox
        run: ./scripts/mail-local.sh test
      - name: Mail logs
        if: failure()
        run: ./scripts/mail-local.sh logs
      - name: Stop test mail stack
        if: always()
        run: docker compose -f mail/compose.local.yaml down --volumes
