name: Shared skills upstream
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  skills-upstream:
    name: Shared skills match public pin
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"
      - name: Check skill catalog, host discovery and source integrity
        run: |
          python3 scripts/sync-agent-skills.py --check
          python3 scripts/check-agent-assets.py
      - name: Validate project context and evaluation cases
        run: |
          python3 skills/orbyn-setup/scripts/project_context.py check --project .
          python3 skills/orbyn-skill-creator/scripts/evaluate.py validate
      - name: Read the locked public revision
        id: pin
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json, re
          from pathlib import Path
          revision = json.loads(Path('skills/upstream-lock.json').read_text())['revision']
          if not isinstance(revision, str) or not re.fullmatch('[0-9a-f]{40}', revision):
              raise SystemExit('Expected a full public revision')
          print(f'revision={revision}')
          PY
      - name: Read the canonical public snapshot
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: kinqsradio/orbyn-fullstack-skills
          ref: ${{ steps.pin.outputs.revision }}
          path: .public-skills
          persist-credentials: false
      - run: python3 scripts/sync-public-skills.py check --root . --upstream .public-skills
