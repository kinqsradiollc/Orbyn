# API gateway: the single entry point for every client (web, mobile, desktop).
# Routes each path to the service that owns it; keep in step with
# serviceModules in backend/src/app.ts. Services are internal to Docker.
limit_req_zone $binary_remote_addr zone=gateway_limit:10m rate=20r/s;

server {
  listen 8080;
  # Docker's DNS, resolved per request so restarting a service never breaks routing.
  resolver 127.0.0.11 valid=10s ipv6=off;
  client_max_body_size 64k;

  proxy_http_version 1.1;
  proxy_read_timeout 75s;
  proxy_set_header Host $host;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;

  location = /health {
    access_log off;
    default_type application/json;
    return 200 '{"status":"ok","service":"gateway"}';
  }

  # AI assistant service.
  location /ai/ {
    limit_req zone=gateway_limit burst=40 nodelay;
    set $ai_upstream ai:8000;
    proxy_pass http://$ai_upstream;
  }

  # Public status report.
  location = /status {
    set $status_upstream status:8000;
    proxy_pass http://$status_upstream;
  }

  # Everything else: the planner API.
  location / {
    limit_req zone=gateway_limit burst=40 nodelay;
    set $api_upstream api:8000;
    proxy_pass http://$api_upstream;
  }
}
